name: Flash integration checks

on:
  pull_request:
    paths:
      - "api/**"
      - "src/**"
      - "supabase/migrations/**"
      - "package*.json"
      - ".github/workflows/flash-integration-checks.yml"
  push:
    branches:
      - fix/flash-employee-identity

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node --test api/_lib/*.test.js
      - run: npm run build
