name: Registros filter validation

on:
  pull_request:
    paths:
      - "src/pages/Registros.jsx"
      - "src/lib/attendanceService.js"
      - "supabase/migrations/**"
      - "package*.json"
      - ".github/workflows/registros-filter-validation.yml"
  push:
    branches:
      - fix/filters-employees-by-company

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
